server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga-orchestrator
  # 8089 aws-adapter-worker
  port: 8089

spring:
  application:
    name: aws-adapter-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: aws_adapter

  flyway:
    enabled: true
    default-schema: aws_adapter
    schemas: aws_adapter
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: aws-adapter-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    listener:
      ack-mode: manual
      # Day 24: THE consumer half of trace propagation. With this on, Spring Kafka
      # wraps every record in a receiver Observation and runs the W3C propagator to
      # EXTRACT the "traceparent" header (which Debezium copied out of the outbox
      # row). Result: the listener's span is a CHILD of the span that appended the
      # event — not a brand-new root. This single flag is what turns 8 disconnected
      # traces into 1.
      observation-enabled: true
    template:
      # Sender spans for the auto-configured KafkaTemplate (used by the DLT
      # recoverer). Not on the main trace path — domain events go via the outbox —
      # but free and keeps DLT hops visible.
      observation-enabled: true

finflow:
  tenant-id: default
  chaos-api:
    base-url: http://localhost:9000
    # HTTP-level read timeout — the "TimeLimiter" of the Resilience4j stack per the plan.
    # The chaos-api's injected hangs are 5s; 10s here catches them and turns them into
    # an ordinary IOException the Retry policy handles.
    read-timeout: 10s
    connect-timeout: 5s

# Resilience4j: full stack per the plan's Day-21 tuning targets.
# retry 3x/200ms base+jitter 0.3 · CB 50%/20 calls · TimeLimiter 7s · bulkhead 10.
resilience4j:
  retry:
    instances:
      aws-chaos:
        max-attempts: 3
        wait-duration: 200ms                 # plan target: 200ms base
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2     # 200 -> 400 -> 800 (capped by 3 attempts, < 2s)
        enable-randomized-wait: true
        randomized-wait-factor: 0.3           # plan target: 0.3 jitter
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException   # 4xx won't heal
  circuitbreaker:
    instances:
      aws-chaos:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20               # plan target: last 20 calls
        minimum-number-of-calls: 10           # need 10 samples before it can open
        failure-rate-threshold: 50            # plan target: 50%
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      aws-chaos:
        timeout-duration: 7s                  # plan target: 7s (> the 5s chaos hang)
        cancel-running-future: true
  bulkhead:
    instances:
      aws-chaos:
        max-concurrent-calls: 10
        max-wait-duration: 100ms

# Day 21: expose circuit-breaker + retry + timelimiter state via Actuator so
# Day 23's Grafana can scrape them.
management:
  # Day 24: distributed tracing.
  tracing:
    enabled: true
    sampling:
      # 100%. The Spring default is 0.1 (10%) — with 10% sampling you fire a saga,
      # go looking for the trace, and it isn't there. Nothing is more maddening on
      # this day. Turn this down for anything resembling production.
      probability: 1.0
  otlp:
    tracing:
      # The services run on the HOST; this is the OTel Collector's published port.
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retryevents,bulkheads,timelimiters,prometheus
  endpoint:
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    io.finflow.adapter.aws: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-},%X{spanId:-}] %cyan(%logger{0}) - %msg%n"
