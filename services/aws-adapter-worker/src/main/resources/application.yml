server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga-orchestrator
  # 8089 aws-adapter-worker
  port: 8089

spring:
  application:
    name: aws-adapter-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: aws_adapter

  flyway:
    enabled: true
    default-schema: aws_adapter
    schemas: aws_adapter
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: aws-adapter-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    listener:
      ack-mode: manual

finflow:
  tenant-id: default
  chaos-api:
    base-url: http://localhost:9000
    # HTTP-level read timeout — the "TimeLimiter" of the Resilience4j stack per the plan.
    # The chaos-api's injected hangs are 5s; 10s here catches them and turns them into
    # an ordinary IOException the Retry policy handles.
    read-timeout: 10s
    connect-timeout: 5s

# Resilience4j: retry + circuit breaker + bulkhead per the plan. TimeLimiter is
# realized as read-timeout above (see AwsChaosClientConfig for the rationale).
resilience4j:
  retry:
    instances:
      aws-chaos:
        max-attempts: 3
        wait-duration: 500ms
        # exponential-backoff-multiplier and randomized-wait-factor together
        # give exponential backoff with jitter (per the plan: "exp backoff with jitter"):
        # attempt 1: ~500ms  attempt 2: ~1000ms  attempt 3: ~2000ms, each ± ~50%.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
  circuitbreaker:
    instances:
      aws-chaos:
        # Open after 5 failures in a 60s window; probe again after 30s.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    instances:
      aws-chaos:
        # Max 10 concurrent calls per tenant. Semaphore-based (cheap; no thread pool).
        # Callers block up to 100ms for a permit before throwing BulkheadFullException.
        max-concurrent-calls: 10
        max-wait-duration: 100ms

logging:
  level:
    io.finflow.adapter.aws: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
