spring:
  application:
    name: aws-ingestor

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ingestion

  flyway:
    enabled: true
    schemas: ingestion
    default-schema: ingestion
    create-schemas: true      # create the ingestion schema if Day 1 init didn't
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092   # host-facing listener from Day 1 compose
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: aws-ingestor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.finflow.*"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

finflow:
  chaos-api:
    base-url: http://localhost:9000
  aws:
    ingest:
      poll-interval: 30s   # @Scheduled fixedDelay between polls (dev)
      initial-delay: 10s   # warm-up before the first poll

# Bounded retry for the Chaos API poll. The Chaos API injects ~20% 503s;
# retry those (and connection errors), but never a 4xx (it won't heal).
resilience4j:
  retry:
    instances:
      chaos-api:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException


logging:
  level:
    io.finflow.ingestion: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
