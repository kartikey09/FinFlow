server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer · 8086 commitment-tracker
  port: 8086

spring:
  application:
    name: commitment-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: commitments
        # Per-row commit avoids one bad event poisoning a batch of state writes.
        jdbc.batch_size: 1

  flyway:
    enabled: true
    default-schema: commitments
    schemas: commitments
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: commitment-tracker
      auto-offset-reset: earliest
      enable-auto-commit: false                  # manual ack — offset committed only after handling
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000               # discover new finflow.events.* topics quickly (dev)
    producer:
      # In case a DLT recoverer is added later (parallels cost-normalizer's Day 10).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # Day 21: idempotence + hard delivery cap.
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual

finflow:
  tenant-id: default

  commitment:
    # Underutilization rule: utilization < threshold for >= streak-days consecutive days.
    underutilization:
      threshold-fraction: 0.50                   # < 50% utilization counts as "under"
      streak-days: 3                              # for 3+ consecutive days
    # Expiry checker: emit CommitmentExpiringSoon when expires_at <= now + window.
    expiry:
      window-days: 30
      cron: "0 0 4 * * *"                         # daily at 04:00 (after retention at 03:00)

# Day 21: Retry on transient DB write failures (config-ready; opt-in via annotation).
resilience4j:
  retry:
    instances:
      db-write:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataIntegrityViolationException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retryevents,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.finflow.commitment: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
