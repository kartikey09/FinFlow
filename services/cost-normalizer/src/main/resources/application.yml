server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Kafka Connect (infra) · 8085 cost-normalizer
  port: 8085

spring:
  application:
    name: cost-normalizer

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: normalizer

  flyway:
    enabled: true
    default-schema: normalizer
    schemas: normalizer
    create-schemas: true                   # ensure 'normalizer' exists on a fresh volume
    locations: classpath:db/migration
    # classpath:db/outbox is intentionally NOT listed here — its V1 would collide
    # with this service's V1__baseline. It runs on a SEPARATE Flyway history
    # timeline in OutboxFlywayConfig (same trick as the ingestors).

  kafka:
    bootstrap-servers: localhost:29092      # external listener (service runs on host via bootRun)
    consumer:
      group-id: cost-normalizer
      auto-offset-reset: earliest
      enable-auto-commit: false             # manual ack — offset committed only after handling
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000          # discover new finflow.events.* topics quickly (dev)
    producer:
      # The DLT recoverer (Day 10) republishes failed records as raw strings.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # Day 21: idempotence + hard delivery cap. Plan says "kafka producer:
      # just rely on built-in retries + idempotence" — no Resilience4j wrapper.
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual
      # Day 24: THE consumer half of trace propagation. With this on, Spring Kafka
      # wraps every record in a receiver Observation and runs the W3C propagator to
      # EXTRACT the "traceparent" header (which Debezium copied out of the outbox
      # row). Result: the listener's span is a CHILD of the span that appended the
      # event — not a brand-new root. This single flag is what turns 8 disconnected
      # traces into 1.
      observation-enabled: true
    template:
      # Sender spans for the auto-configured KafkaTemplate (used by the DLT
      # recoverer). Not on the main trace path — domain events go via the outbox —
      # but free and keeps DLT hops visible.
      observation-enabled: true

# Tenant assigned to every normalized line item. Single-tenant in MVP; ready for
# multi-tenant later (just inject from auth / request context).
finflow:
  tenant-id: default
  dedup:
    cache-size: 100000                      # L1 Caffeine cache: last 100k event ids

# Day 21: Retry on transient DB write failures (plan: "database calls: just Retry").
# Config-ready; annotate the write methods you want covered with @Retry(name="db-write").
# See DAY21-MANIFEST for recommended call sites (OutboxAppender, projection saves).
resilience4j:
  retry:
    instances:
      db-write:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataIntegrityViolationException

management:
  # Day 24: distributed tracing.
  tracing:
    enabled: true
    sampling:
      # 100%. The Spring default is 0.1 (10%) — with 10% sampling you fire a saga,
      # go looking for the trace, and it isn't there. Nothing is more maddening on
      # this day. Turn this down for anything resembling production.
      probability: 1.0
  otlp:
    tracing:
      # The services run on the HOST; this is the OTel Collector's published port.
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retryevents,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.finflow.normalizer: INFO
    io.github.resilience4j: INFO
