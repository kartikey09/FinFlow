server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga-orchestrator
  # 8089 aws-adapter-worker · 8090 gcp-adapter-worker
  port: 8090

spring:
  application:
    name: gcp-adapter-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: gcp_adapter

  flyway:
    enabled: true
    default-schema: gcp_adapter
    schemas: gcp_adapter
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: gcp-adapter-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    listener:
      ack-mode: manual

finflow:
  tenant-id: default
  chaos-api:
    base-url: http://localhost:9000
    read-timeout: 10s
    connect-timeout: 5s

# Same values as aws-adapter-worker, just under a different instance name. If we
# ever need per-vendor tuning (e.g. GCP's real API rate-limits differ from AWS),
# this is where it would diverge.
resilience4j:
  retry:
    instances:
      gcp-chaos:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
  circuitbreaker:
    instances:
      gcp-chaos:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    instances:
      gcp-chaos:
        max-concurrent-calls: 10
        max-wait-duration: 100ms

logging:
  level:
    io.finflow.adapter.gcp: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
