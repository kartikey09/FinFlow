spring:
  application:
    name: gcp-ingestor

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: gcp_ingestion   # this service's own tables; shared outbox pinned to public via orm.xml

  flyway:
    enabled: true
    schemas: gcp_ingestion
    default-schema: gcp_ingestion
    create-schemas: true
    locations: classpath:db/migration
    # classpath:db/outbox runs on a separate Flyway history timeline in
    # OutboxFlywayConfig (its V1 would collide with this service's V1__baseline).

server:
  port: 8082      # aws-ingestor is 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retryevents,timelimiters
  endpoint:
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

finflow:
  chaos-api:
    base-url: http://localhost:9000
  gcp:
    ingest:
      poll-interval: PT30S
      initial-delay: PT12S    # offset from aws (10s) so both don't poll in lockstep

# Day 21: full HTTP resilience stack for the Chaos API poll (matches aws-ingestor).
resilience4j:
  retry:
    instances:
      chaos-api:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.3
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      chaos-api:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      chaos-api:
        timeout-duration: 7s
        cancel-running-future: true

logging:
  level:
    io.finflow.ingestion: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
