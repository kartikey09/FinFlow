spring:
  application:
    name: gcp-ingestor

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: gcp_ingestion   # this service's own tables; shared outbox pinned to public via orm.xml

  flyway:
    enabled: true
    schemas: gcp_ingestion
    default-schema: gcp_ingestion
    create-schemas: true
    locations: classpath:db/migration
    # classpath:db/outbox runs on a separate Flyway history timeline in
    # OutboxFlywayConfig (its V1 would collide with this service's V1__baseline).

server:
  port: 8082      # aws-ingestor is 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

finflow:
  chaos-api:
    base-url: http://localhost:9000
  gcp:
    ingest:
      poll-interval: 30s
      initial-delay: 12s      # offset from aws (10s) so both don't poll in lockstep

# Same retry policy as aws-ingestor: absorb the Chaos API's injected 503s.
resilience4j:
  retry:
    instances:
      chaos-api:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

logging:
  level:
    io.finflow.ingestion: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
