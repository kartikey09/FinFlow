server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api
  port: 8087

spring:
  application:
    name: query-api

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: read_model

  flyway:
    enabled: true
    default-schema: read_model
    schemas: read_model
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: query-api
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    listener:
      ack-mode: manual

finflow:
  tenant-id: default
  aws-ingestor:
    # Where /api/v1/admin/trigger-ingest?vendor=aws forwards the trigger for the demo.
    base-url: http://localhost:8081
  gcp-ingestor:
    base-url: http://localhost:8082
  # Same-origin: dashboard on :3000 proxies to /api via Vite dev server config.
  cors:
    allowed-origins: "http://localhost:3000"

# Day 21: Retry on transient DB write failures (projection upserts). Config-ready;
# opt-in via @Retry(name="db-write"). query-api has no producer (pure read sink).
resilience4j:
  retry:
    instances:
      db-write:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataIntegrityViolationException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retryevents
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.finflow.query: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
