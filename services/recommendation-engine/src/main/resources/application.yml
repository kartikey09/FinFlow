server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga · 8089/8090 adapters · 9000 chaos
  port: 8091

spring:
  application:
    name: recommendation-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: recommendations
        jdbc.batch_size: 1

  flyway:
    enabled: true
    # The engine owns the 'recommendations' schema. The outbox-starter also runs its
    # own migration into the default schema (public) via OutboxSchemaAutoConfiguration,
    # exactly as it does for the other five producers.
    default-schema: recommendations
    schemas: recommendations
    create-schemas: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: recommendation-engine
      auto-offset-reset: earliest
      enable-auto-commit: false                  # manual ack
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual

finflow:
  tenant-id: default

  # The three rules, as thresholds. Kept in config so the pure RecommendationRules can be
  # unit-tested with explicit values and tuned in production without a recompile.
  reco:
    # REBALANCE once a commitment is under-utilized for this many consecutive days...
    rebalance-streak-days: 3
    # ...and SELL (not just move) once it's been idle this long with no recovery.
    sell-streak-days: 14
    purchase:
      # PURCHASE_COMMITMENT needs sustained on-demand spend: this many distinct days...
      min-observed-days: 7
      # ...and at least this cumulative on-demand spend (the break-even proxy).
      break-even-usd: 500.0
    # Assumed committed-use discount — how much of on-demand spend a commitment saves.
    commitment-discount-fraction: 0.30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.finflow.recommendation: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
