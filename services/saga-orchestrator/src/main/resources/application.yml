server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga-orchestrator
  port: 8088

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: saga

  flyway:
    enabled: true
    default-schema: saga
    schemas: saga
    create-schemas: true
    locations: classpath:db/migration

logging:
  level:
    io.finflow.saga: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %cyan(%logger{0}) - %msg%n"
