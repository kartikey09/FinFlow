server:
  # 8081 aws-ingestor · 8082 gcp-ingestor · 8083 Connect · 8085 cost-normalizer
  # 8086 commitment-tracker · 8087 query-api · 8088 saga-orchestrator
  port: 8088

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: saga

  flyway:
    enabled: true
    default-schema: saga
    schemas: saga
    create-schemas: true
    locations: classpath:db/migration
    # classpath:db/outbox is intentionally NOT listed here — its V1 would
    # collide with this service's V1__baseline (same trick as ingestors/normalizer).

  kafka:
    bootstrap-servers: localhost:29092                    # external listener
    consumer:
      group-id: saga-orchestrator
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 10000
    producer:
      # Day 21: producer for the DLT recoverer (Day 20 KafkaErrorHandlingConfig).
      # Kafka's idempotence + retries do the work; no Resilience4j wrapper.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 2147483647
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual
      # Day 24: THE consumer half of trace propagation. With this on, Spring Kafka
      # wraps every record in a receiver Observation and runs the W3C propagator to
      # EXTRACT the "traceparent" header (which Debezium copied out of the outbox
      # row). Result: the listener's span is a CHILD of the span that appended the
      # event — not a brand-new root. This single flag is what turns 8 disconnected
      # traces into 1.
      observation-enabled: true
    template:
      # Sender spans for the auto-configured KafkaTemplate (used by the DLT
      # recoverer). Not on the main trace path — domain events go via the outbox —
      # but free and keeps DLT hops visible.
      observation-enabled: true

finflow:
  tenant-id: default

# Day 21: Retry on transient DB write failures for the SagaInstance write path.
# CRITICAL: OptimisticLockingFailureException is EXCLUDED — on the saga that's
# the signal another writer advanced the state, and Kafka redelivery (not an
# in-process retry) is the correct recovery. Only deadlocks / connection blips retry.
resilience4j:
  retry:
    instances:
      db-write:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.CannotAcquireLockException
          - org.springframework.dao.DeadlockLoserDataAccessException
          - org.springframework.dao.TransientDataAccessException
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.OptimisticLockingFailureException
          - org.springframework.dao.DataIntegrityViolationException

management:
  # Day 24: distributed tracing.
  tracing:
    enabled: true
    sampling:
      # 100%. The Spring default is 0.1 (10%) — with 10% sampling you fire a saga,
      # go looking for the trace, and it isn't there. Nothing is more maddening on
      # this day. Turn this down for anything resembling production.
      probability: 1.0
  otlp:
    tracing:
      # The services run on the HOST; this is the OTel Collector's published port.
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,retryevents,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.finflow.saga: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-},%X{spanId:-}] %cyan(%logger{0}) - %msg%n"
